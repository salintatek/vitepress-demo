[build.environment]
NODE_VERSION = "24"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[build]
publish = "docs/.vitepress/dist"
command = "pnpm docs:build docs"

[[headers]]
for = "/assets/*"
[headers.values]
cache-control = '''
    max-age=31536000,
    immutable'''

[[headers]]
for = "/_translations/*"
[headers.values]
x-robots-tag = "noindex"